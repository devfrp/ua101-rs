name: Release

# Push a tag such as v0.1.0 to build every platform and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - run: cargo build --release --locked -p ua101-cli -p ua101-panel
      - name: Package
        run: |
          mkdir -p dist/ua101-linux
          cp target/release/ua101 target/release/ua101-panel dist/ua101-linux/
          cp packaging/linux/60-ua101.rules packaging/linux/ua101-panel.desktop \
             packaging/linux/install.sh README.md LICENSE-MIT LICENSE-APACHE dist/ua101-linux/
          tar -czf ua101-linux-${{ matrix.arch }}.tar.gz -C dist ua101-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ua101-linux-${{ matrix.arch }}.tar.gz

  linux-musl:
    name: linux (x86_64 musl, CLI only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p ua101-cli --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist/ua101-linux
          cp target/x86_64-unknown-linux-musl/release/ua101 dist/ua101-linux/
          cp packaging/linux/60-ua101.rules packaging/linux/install.sh README.md \
             LICENSE-MIT LICENSE-APACHE dist/ua101-linux/
          tar -czf ua101-linux-x86_64-musl.tar.gz -C dist ua101-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: ua101-linux-x86_64-musl.tar.gz

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p ua101-cli -p ua101-panel
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/ua101.exe ua101-windows-x86_64.exe
          Copy-Item target/release/ua101-panel.exe ua101-panel-windows-x86_64.exe
          New-Item -ItemType Directory dist/ua101-windows | Out-Null
          Copy-Item target/release/ua101.exe, target/release/ua101-panel.exe, `
            packaging/windows/README.md, LICENSE-MIT, LICENSE-APACHE dist/ua101-windows/
          Compress-Archive -Path dist/ua101-windows -DestinationPath ua101-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ua101-windows-x86_64.exe
            ua101-panel-windows-x86_64.exe
            ua101-windows-x86_64.zip

  macos:
    name: macos (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - run: |
          cargo build --release --locked -p ua101-cli -p ua101-panel --target aarch64-apple-darwin
          cargo build --release --locked -p ua101-cli -p ua101-panel --target x86_64-apple-darwin
      - run: sh packaging/macos/make-app.sh "${GITHUB_REF_NAME}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ua101-macos-universal.dmg
            dist/ua101-macos-universal-app.zip
            dist/ua101-macos-universal-cli.tar.gz

  publish:
    name: publish release
    needs: [linux, linux-musl, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
