[package]
name = "ua101-panel"
description = "Control panel for the Roland/EDIROL UA-101 (Rust user-space driver)"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["gui", "hardware-support", "multimedia::audio"]

[[bin]]
name = "ua101-panel"
path = "src/main.rs"

[dependencies]
ua101-usb.workspace = true
env_logger.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
