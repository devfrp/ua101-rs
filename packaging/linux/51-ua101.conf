# WirePlumber 0.5 rules installed by ua101-rs.
#
# The ua101d daemon exposes the UA-101 through the snd-aloop card "UA101RS":
#   device 0 -> applications (this is "UA-101" in PipeWire),
#   device 1 -> reserved for ua101d (hidden here).
# The loopback only accepts the format the daemon uses, so the nodes are
# pinned to 10 outputs / 12 inputs at 44.1 kHz with the pro-audio profile.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" alsa.id = "UA101RS" } ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.description = "UA-101"
        device.nick = "UA-101"
      }
    }
  }
  {
    # The daemon's side of the loopback.
    matches = [ { alsa.id = "UA101RS" alsa.device = "1" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { alsa.id = "UA101RS" alsa.device = "0" api.alsa.pcm.stream = "playback" } ]
    actions = {
      update-props = {
        node.description = "UA-101"
        node.nick = "UA-101"
        audio.channels = 10
        audio.position = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 ]
        audio.format = "S32LE"
        audio.rate = 44100
      }
    }
  }
  {
    matches = [ { alsa.id = "UA101RS" alsa.device = "0" api.alsa.pcm.stream = "capture" } ]
    actions = {
      update-props = {
        node.description = "UA-101"
        node.nick = "UA-101"
        audio.channels = 12
        audio.position = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 ]
        audio.format = "S32LE"
        audio.rate = 44100
      }
    }
  }
]
